<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск номера по секциям</title>
    <style>
        :root {
            --bg: #f4f2ee;
            --card: #ffffff;
            --text: #2b2b2b;
            --muted: #8a8a85;
            --border: #e2dfd8;
            --error: #c0392b;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: clamp(12px, 3vw, 32px) clamp(6px, 2vw, 16px) 48px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 18px;
        }

        .search {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .search input {
            width: 180px;
            padding: 14px 16px;
            font-size: 1.6rem;
            letter-spacing: 0.3em;
            text-align: center;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .search input:focus {
            border-color: #5a7c8c;
            box-shadow: 0 0 0 4px rgba(90, 124, 140, 0.18);
        }

        .search input.invalid {
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.15);
        }

        .message {
            min-height: 1.4em;
            font-size: 0.95rem;
            color: var(--muted);
            transition: color 0.25s ease, opacity 0.25s ease;
        }

        .message.error {
            color: var(--error);
            font-weight: 600;
        }

        /* Основной грид секций: всегда 6 колонок и 3 ряда, порядок не меняется в адаптиве.
           Секции заполняют грид по колонкам (сверху вниз, затем следующая колонка) */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            grid-template-rows: repeat(3, auto);
            grid-auto-flow: column;
            gap: clamp(4px, 1.2vw, 14px);
        }

        .cell {
            --accent: #ccc;
            --cell-text: var(--text);
            position: relative;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: clamp(6px, 1.2vw, var(--radius));
            padding: clamp(4px, 1.2vw, 12px);
            overflow: hidden;
            color: var(--text);
            /* Размеры шрифтов внутри ячейки зависят от ее ширины */
            container-type: inline-size;
            transition:
                    background-color 0.35s ease,
                    border-color 0.35s ease,
                    color 0.35s ease,
                    transform 0.35s ease,
                    box-shadow 0.35s ease,
                    opacity 0.35s ease;
        }

        /* Цветная полоска-индикатор секции */
        .cell::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent);
        }

        .cell-title {
            font-size: clamp(0.4rem, 9cqw, 0.75rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.7;
            margin: 4px 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
        }

        .numbers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        /* Числа скрыты во всех ячейках, место под них сохраняется */
        .num {
            font-size: clamp(0.4rem, 10cqw, 0.8rem);
            text-align: center;
            padding: 4px 0;
            border-radius: 6px;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
        }

        /* Приглушение остальных ячеек во время поиска */
        .grid.searching .cell {
            opacity: 0.45;
        }

        /* Найденная ячейка заливается цветом accentColor */
        .grid.searching .cell.active {
            opacity: 1;
            background: var(--accent);
            border-color: var(--accent);
            color: var(--cell-text);
            transform: scale(1.04);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
            z-index: 1;
            animation: pop 0.45s ease;
        }

        .cell.active::before {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Числа видны только в найденной ячейке */
        .cell.active .num {
            opacity: 1;
        }

        /* Найденный номер внутри ячейки */
        .num.found {
            background: var(--cell-text);
            color: var(--accent);
            font-weight: 700;
            transform: scale(1.15);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            60% { transform: scale(1.09); }
            100% { transform: scale(1.04); }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Поиск номера по секциям</h1>
        <div class="search">
            <input
                    id="numberInput"
                    type="text"
                    inputmode="numeric"
                    maxlength="3"
                    placeholder="000"
                    autocomplete="off"
                    aria-label="Введите трехзначное число"
            >
            <p id="message" class="message" role="status" aria-live="polite">Введите трехзначное число</p>
        </div>
    </header>

    <main id="grid" class="grid"></main>
</div>

<script>
    const sectionsData = [
        { numbers: [876, 700, 847, 648, 735, 727, 787, 647, 657, 682, 634, 676, 669, 614, 846, 845], accentColor: "#8B8B7A" },
        { numbers: [687, 668, 665, 740, 728, 794, 796, 795, 886, 730, 809, 627, 737, 685, 850, 602], accentColor: "#6A8E7F" },
        { numbers: [653, 722, 799, 695, 609, 800, 797, 858, 707, 775, 851, 696, 641, 622, 792, 642], accentColor: "#6B7C5C" },
        { numbers: [697, 791, 626, 729, 652, 640, 852, 741, 849, 637, 788, 793, 790, 789, 810, 811], accentColor: "#7A8468" },
        { numbers: [812, 813, 814, 815, 817, 816, 645, 731, 757, 871, 874, 868, 758, 866, 643, 878], accentColor: "#5A7C8C" },
        { numbers: [821, 628, 822, 601, 650, 621, 659, 617, 746, 824, 608, 673, 736, 841, 842, 843], accentColor: "#4A7A8A" },
        { numbers: [844, 690, 768, 681, 633, 767, 748, 694, 818, 885, 819, 820, 689, 823, 616, 798], accentColor: "#5A5A8A" },
        { numbers: [636, 774, 688, 749, 750, 747, 693, 806, 763, 879, 830, 745, 670, 629, 651, 828], accentColor: "#8A5A7A" },
        { numbers: [742, 743, 607, 678, 764, 734, 880, 744, 698, 635, 623, 699, 833, 832, 613, 778], accentColor: "#C25A5A" },
        { numbers: [835, 829, 825, 826, 773, 827, 831, 883, 881, 837, 721, 882, 703, 624, 625, 704], accentColor: "#D18B5A" },
        { numbers: [691, 667, 605, 674, 664, 781, 872, 716, 677, 692, 761, 711, 710, 713, 714, 715], accentColor: "#D4B55A" },
        { numbers: [760, 836, 838, 723, 873, 658, 655, 612, 606, 666, 671, 726, 719, 701, 720, 702], accentColor: "#D1C1A0" },
        { numbers: [649, 786, 604, 725, 631, 785, 877, 887, 724, 683, 684, 718, 802, 618, 766, 732], accentColor: "#B0B0A0" },
        { numbers: [733, 777, 765, 656, 603, 615, 663, 783, 782, 632, 784, 862, 840, 630, 754, 755], accentColor: "#7A7A6A" },
        { numbers: [756, 619, 875, 869, 672, 780, 834, 839, 772, 739, 675, 705, 738, 752, 771, 770], accentColor: "#8A7A5A" },
        { numbers: [769, 779, 808, 776, 717, 654, 644, 639, 620, 863, 864, 867, 870, 865, 759, 708], accentColor: "#7A8A9A" },
        { numbers: [709, 646, 848, 638, 751, 753, 600, 706, 884, 801, 803, 804, 853, 686, 610, 805], accentColor: "#5A6A8A" },
        { numbers: [861, 857, 860, 679, 680, 807, 611, 855, 856, 662, 859, 661, 854, 712, 762, 660], accentColor: "#7A9A7A" }
    ];

    const grid = document.getElementById('grid');
    const input = document.getElementById('numberInput');
    const message = document.getElementById('message');

    const cells = [];

    // Определяем читаемый цвет текста (светлый или тёмный) по яркости фона
    function getContrastColor(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.6 ? '#1f1f1f' : '#ffffff';
    }

    // Построение грида на основе sectionsData
    sectionsData.forEach((section, index) => {
        const cell = document.createElement('article');
        cell.className = 'cell';
        cell.style.setProperty('--accent', section.accentColor);
        cell.style.setProperty('--cell-text', getContrastColor(section.accentColor));

        const title = document.createElement('h2');
        title.className = 'cell-title';
        title.textContent = 'Секция ' + (index + 1);

        const numbersBox = document.createElement('div');
        numbersBox.className = 'numbers';

        const numEls = new Map();
        section.numbers.forEach(n => {
            const el = document.createElement('span');
            el.className = 'num';
            el.textContent = n;
            numbersBox.appendChild(el);
            numEls.set(n, el);
        });

        cell.append(title, numbersBox);
        grid.appendChild(cell);
        cells.push({ cell, numEls, section });
    });

    // Сброс подсветки
    function reset() {
        grid.classList.remove('searching');
        cells.forEach(({ cell, numEls }) => {
            cell.classList.remove('active');
            numEls.forEach(el => el.classList.remove('found'));
        });
    }

    function setMessage(text, isError) {
        message.textContent = text;
        message.classList.toggle('error', Boolean(isError));
        input.classList.toggle('invalid', Boolean(isError));
    }

    // Поиск и подсветка
    function search(value) {
        reset();

        if (value.length === 0) {
            setMessage('Введите трехзначное число', false);
            return;
        }

        if (value.length < 3) {
            setMessage('Нужно ввести три цифры', false);
            return;
        }

        const number = Number(value);
        const found = cells.find(({ section }) => section.numbers.includes(number));

        if (!found) {
            setMessage('Номер ' + value + ' не найден', true);
            return;
        }

        grid.classList.add('searching');
        found.cell.classList.add('active');
        found.numEls.get(number).classList.add('found');
        setMessage('Номер ' + value + ' найден в секции ' + (cells.indexOf(found) + 1), false);
        found.cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Оставляем только цифры и запускаем поиск
    input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 3);
        search(input.value);
    });
</script>
</body>
</html>
